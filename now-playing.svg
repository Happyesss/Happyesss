<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .bar{fill:#00d9ff;transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
      .b2{animation-delay:-.3s}.b3{animation-delay:-.6s}.b4{animation-delay:-.15s}.b5{animation-delay:-.45s}
      @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 2s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(1.35)}}
      .prog{animation:pr 30s linear infinite}
      @keyframes pr{from{width:0}to{width:150px}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="339" height="111" rx="14" fill="url(#bg)" stroke="#00d9ff" stroke-opacity=".35"/>
  <!-- album art -->
  <rect x="14" y="16" width="80" height="80" rx="10" fill="url(#art)"/>
  <circle cx="54" cy="56" r="24" fill="#1a1b27" opacity=".85"/>
  <circle cx="54" cy="56" r="6" fill="url(#art)"/>
  <!-- text -->
  <text x="108" y="34" class="t" font-size="11" font-weight="600" fill="#00d9ff" letter-spacing="1.5">NOW PLAYING</text>
  <text x="108" y="56" class="t" font-size="15" font-weight="700" fill="#ffffff">The Winner Takes It All</text>
  <text x="108" y="74" class="t" font-size="12" fill="#a9b1d6">ABBA</text>
  <!-- equalizer -->
  <g transform="translate(150,64)">
    <rect class="bar" x="0" y="0" width="3" height="12" rx="1"/>
    <rect class="bar b2" x="5" y="0" width="3" height="12" rx="1"/>
    <rect class="bar b3" x="10" y="0" width="3" height="12" rx="1"/>
    <rect class="bar b4" x="15" y="0" width="3" height="12" rx="1"/>
    <rect class="bar b5" x="20" y="0" width="3" height="12" rx="1"/>
  </g>
  <!-- progress -->
  <rect x="108" y="86" width="150" height="4" rx="2" fill="#3b4261"/>
  <rect class="prog" x="108" y="86" width="0" height="4" rx="2" fill="#00d9ff"/>
  <!-- play button -->
  <circle class="pulse" cx="300" cy="56" r="22" fill="#00d9ff"/>
  <circle cx="300" cy="56" r="20" fill="#00d9ff"/>
  <path d="M294 46 L310 56 L294 66 Z" fill="#1a1b27"/>
</svg>
